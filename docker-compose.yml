name: carteira-igaming

# Segredos abaixo são só para desenvolvimento local.
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://wallet:wallet@postgres:5432/wallet
  DB_POOL_MAX: "20"
  REDIS_URL: redis://redis:6379/0
  QUEUE_PREFIX: wallet
  PIX_WEBHOOK_SECRET: dev-pix-webhook-secret-change-me
  GAME_PROVIDER_KEYS: acme-games:dev-provider-key
  DEV_ENDPOINTS: "true"

x-app: &app
  build: .
  image: carteira-igaming:local
  # reinicia se o processo cair, mas não sobe sozinho quando o daemon do Docker reinicia
  restart: on-failure

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # noeviction: o BullMQ não pode perder chaves por pressão de memória
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "56379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # roda as migrações uma vez; api e worker só sobem depois que ela termina com sucesso
  migrate:
    <<: *app
    restart: "no"
    command: ["node", "dist/database/migrate.js"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-env
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # teste de carga: docker compose --profile load run --rm k6
  k6:
    image: grafana/k6:1.3.0
    profiles: ["load"]
    environment:
      BASE_URL: http://api:3000
      PROVIDER_KEY: dev-provider-key
    volumes:
      - ./load:/scripts:ro
    command: ["run", "/scripts/bets.js"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
